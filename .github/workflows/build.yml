name: Сборка APK и сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install

      - name: Номер сборки в приложение
        run: sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html

      - name: Создать Android-проект
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0E7350' --iconBackgroundColorDark '#0E7350' --splashBackgroundColor '#F2F4F1' --splashBackgroundColorDark '#0F1613' || echo "иконки не сгенерировались, остаётся стандартная"
          npx cap sync android

      - name: Номер версии
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Постоянная подпись
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // Одна и та же подпись у всех версий, чтобы обновление ставилось поверх
          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file("../build/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      - name: Собрать APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../training.apk

      - name: Проверить подпись
        run: |
          keytool -printcert -jarfile training.apk | tee cert.txt
          grep -q "41:6C:81:FF:29:7A:36:73:FF:00:91:5A:CA:9A:63:89:0E:19:50:35:0E:0D:24:4B:D0:63:34:FD:DF:9F:7E:71" cert.txt || (echo "Подпись не совпадает с постоянным ключом" && exit 1)

      - name: Выложить APK в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk training.apk --title "Тренировки 1.${{ github.run_number }}" --notes "Скачай training.apk на телефоне и установи." --latest

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
